<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ConKey - PC Remote Keyboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/>
      </svg>
      <span>ConKey</span>
    </div>
    <div class="device-pill">
      <span id="statusDot" class="status-dot"></span>
      <span id="deviceName">{{DEVICE_NAME}}</span>
    </div>
    <a href="/download/conkey.apk" download style="color: var(--accent); font-size: 0.75rem; text-decoration: none; font-weight: 600;">Get APK</a>
  </header>

  <!-- Direct Smart Typing Bar -->
  <div class="typing-bar">
    <input type="text" id="textInput" placeholder="Type or dictate with phone keyboard..." autocomplete="off">
    <button id="sendTextBtn" class="btn-accent" style="min-width: 60px;">Send</button>
  </div>

  <!-- Navigation Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-target="deckFullPC">Full PC</button>
    <button class="tab-btn" data-target="deckShortcuts">Hotkeys</button>
    <button class="tab-btn" data-target="deckFKeys">F-Keys &amp; Num</button>
    <button class="tab-btn" data-target="deckTouchpad">Touchpad</button>
  </div>

  <main>
    <!-- DECK 1: FULL PC KEYBOARD (5 ROWS) -->
    <div id="deckFullPC" class="deck active">
      <!-- Row 1 -->
      <div class="pc-row">
        <button class="w-md" data-key="ESCAPE">Esc</button>
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button data-key="0">0</button>
        <button data-key="-">-</button>
        <button data-key="=">=</button>
        <button class="w-lg" data-key="BACKSPACE">⌫</button>
      </div>

      <!-- Row 2 -->
      <div class="pc-row">
        <button class="w-md" data-key="TAB">Tab</button>
        <button data-key="Q">Q</button>
        <button data-key="W">W</button>
        <button data-key="E">E</button>
        <button data-key="R">R</button>
        <button data-key="T">T</button>
        <button data-key="Y">Y</button>
        <button data-key="U">U</button>
        <button data-key="I">I</button>
        <button data-key="O">O</button>
        <button data-key="P">P</button>
        <button data-key="[">[</button>
        <button data-key="]">]</button>
        <button data-key="\">\</button>
      </div>

      <!-- Row 3 -->
      <div class="pc-row">
        <button class="w-md" data-key="CAPSLOCK">Caps</button>
        <button class="btn-accent" data-key="A">A</button>
        <button class="btn-accent" data-key="S">S</button>
        <button data-key="D">D</button>
        <button data-key="F">F</button>
        <button data-key="G">G</button>
        <button data-key="H">H</button>
        <button data-key="J">J</button>
        <button data-key="K">K</button>
        <button data-key="L">L</button>
        <button data-key=";">;</button>
        <button data-key="'">'</button>
        <button class="w-xl btn-accent" data-key="ENTER">⏎ Enter</button>
      </div>

      <!-- Row 4 -->
      <div class="pc-row">
        <button class="w-lg" data-mod="SHIFT">⇧ Shift</button>
        <button data-key="Z">Z</button>
        <button data-key="X">X</button>
        <button data-key="C">C</button>
        <button data-key="V">V</button>
        <button data-key="B">B</button>
        <button data-key="N">N</button>
        <button data-key="M">M</button>
        <button data-key=",">,</button>
        <button data-key=".">.</button>
        <button data-key="/">/</button>
        <button class="w-sm" data-key="UP">▲</button>
        <button class="w-sm" data-key="DELETE">Del</button>
      </div>

      <!-- Row 5 -->
      <div class="pc-row">
        <button class="w-md" data-mod="CTRL">Ctrl</button>
        <button class="w-sm" data-mod="WIN">⊞ Win</button>
        <button class="w-md" data-mod="ALT">Alt</button>
        <button class="w-space" data-key="SPACE">Space</button>
        <button class="w-md" data-mod="ALT">Alt</button>
        <button class="w-sm" data-key="LEFT">◀</button>
        <button class="w-sm" data-key="DOWN">▼</button>
        <button class="w-sm" data-key="RIGHT">▶</button>
      </div>

      <!-- Quick Broken Keys Rescue Bar -->
      <div class="card" style="margin-top: 4px;">
        <div class="section-label">Broken Keys Rescue</div>
        <div class="grid-4" style="grid-template-columns: repeat(8, 1fr);">
          <button class="btn-accent grid-btn" data-text="!">!</button>
          <button class="btn-accent grid-btn" data-text="A">A</button>
          <button class="btn-accent grid-btn" data-text="a">a</button>
          <button class="btn-accent grid-btn" data-text="S">S</button>
          <button class="btn-accent grid-btn" data-text="s">s</button>
          <button class="grid-btn" data-text="@">@</button>
          <button class="grid-btn" data-text="#">#</button>
          <button class="grid-btn" data-text="?">?</button>
        </div>
      </div>
    </div>

    <!-- DECK 2: POWER SHORTCUTS -->
    <div id="deckShortcuts" class="deck">
      <div class="card">
        <div class="section-label">Clipboard &amp; Editing</div>
        <div class="grid-4">
          <button class="btn-accent grid-btn" data-combo="CTRL+C">Ctrl+C (Copy)</button>
          <button class="btn-accent grid-btn" data-combo="CTRL+V">Ctrl+V (Paste)</button>
          <button class="grid-btn" data-combo="CTRL+X">Ctrl+X (Cut)</button>
          <button class="grid-btn" data-combo="CTRL+A">Ctrl+A (All)</button>
          <button class="grid-btn" data-combo="CTRL+Z">Ctrl+Z (Undo)</button>
          <button class="grid-btn" data-combo="CTRL+Y">Ctrl+Y (Redo)</button>
          <button class="grid-btn" data-combo="CTRL+S">Ctrl+S (Save)</button>
          <button class="grid-btn" data-combo="CTRL+F">Ctrl+F (Find)</button>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Windows Multitasking &amp; Controls</div>
        <div class="grid-4">
          <button class="btn-accent grid-btn" data-combo="ALT+TAB">Alt+Tab</button>
          <button class="grid-btn" data-combo="ALT+F4">Alt+F4</button>
          <button class="grid-btn" data-combo="WIN+D">Win+D (Desktop)</button>
          <button class="grid-btn" data-combo="WIN+TAB">Win+Tab</button>
          <button class="grid-btn" data-combo="WIN+R">Win+R (Run)</button>
          <button class="grid-btn" data-combo="WIN+E">Win+E (Files)</button>
          <button class="grid-btn" data-combo="CTRL+SHIFT+ESCAPE">Ctrl+Shift+Esc</button>
          <button class="grid-btn" data-combo="WIN+L">Win+L (Lock)</button>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Browser &amp; Navigation</div>
        <div class="grid-4">
          <button class="grid-btn" data-combo="CTRL+T">Ctrl+T (New Tab)</button>
          <button class="grid-btn" data-combo="CTRL+W">Ctrl+W (Close Tab)</button>
          <button class="grid-btn" data-combo="CTRL+R">Ctrl+R (Reload)</button>
          <button class="grid-btn" data-combo="CTRL+SHIFT+T">Reopen Tab</button>
          <button class="grid-btn" data-key="F5">F5 (Refresh)</button>
          <button class="grid-btn" data-key="F11">F11 (Fullscreen)</button>
          <button class="grid-btn" data-combo="CTRL+P">Ctrl+P (Print)</button>
          <button class="grid-btn" data-combo="CTRL+N">Ctrl+N (New)</button>
        </div>
      </div>
    </div>

    <!-- DECK 3: F-KEYS & NUMPAD -->
    <div id="deckFKeys" class="deck">
      <div class="card">
        <div class="section-label">Function Keys (F1 - F12)</div>
        <div class="grid-6" style="margin-bottom: 4px;">
          <button class="grid-btn" data-key="F1">F1</button>
          <button class="grid-btn" data-key="F2">F2</button>
          <button class="grid-btn" data-key="F3">F3</button>
          <button class="grid-btn" data-key="F4">F4</button>
          <button class="grid-btn" data-key="F5">F5</button>
          <button class="grid-btn" data-key="F6">F6</button>
        </div>
        <div class="grid-6">
          <button class="grid-btn" data-key="F7">F7</button>
          <button class="grid-btn" data-key="F8">F8</button>
          <button class="grid-btn" data-key="F9">F9</button>
          <button class="grid-btn" data-key="F10">F10</button>
          <button class="grid-btn" data-key="F11">F11</button>
          <button class="grid-btn" data-key="F12">F12</button>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Navigation &amp; System</div>
        <div class="grid-4">
          <button class="grid-btn" data-key="PRINTSCREEN">PrtScn</button>
          <button class="grid-btn" data-key="INSERT">Insert</button>
          <button class="grid-btn" data-key="HOME">Home</button>
          <button class="grid-btn" data-key="PAGEUP">PgUp</button>
          <button class="grid-btn" data-key="DELETE">Delete</button>
          <button class="grid-btn" data-key="END">End</button>
          <button class="grid-btn" data-key="PAGEDOWN">PgDn</button>
          <button class="grid-btn" data-key="PAUSE">Pause</button>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Calculator Numeric Keypad</div>
        <div class="grid-4">
          <button class="grid-btn" data-key="NUMLOCK">NumLk</button>
          <button class="grid-btn" data-key="NUMPAD_DIVIDE">/</button>
          <button class="grid-btn" data-key="NUMPAD_MULTIPLY">*</button>
          <button class="grid-btn" data-key="NUMPAD_SUBTRACT">-</button>

          <button class="grid-btn" data-key="NUMPAD7">7</button>
          <button class="grid-btn" data-key="NUMPAD8">8</button>
          <button class="grid-btn" data-key="NUMPAD9">9</button>
          <button class="grid-btn" data-key="NUMPAD_ADD">+</button>

          <button class="grid-btn" data-key="NUMPAD4">4</button>
          <button class="grid-btn" data-key="NUMPAD5">5</button>
          <button class="grid-btn" data-key="NUMPAD6">6</button>
          <button class="btn-accent grid-btn" data-key="ENTER">⏎</button>

          <button class="grid-btn" data-key="NUMPAD1">1</button>
          <button class="grid-btn" data-key="NUMPAD2">2</button>
          <button class="grid-btn" data-key="NUMPAD3">3</button>
          <button class="grid-btn" data-key="NUMPAD_DECIMAL">.</button>

          <button class="grid-btn" style="grid-column: span 2;" data-key="NUMPAD0">0</button>
          <button class="grid-btn" style="grid-column: span 2;" data-text="=">=</button>
        </div>
      </div>
    </div>

    <!-- DECK 4: TOUCHPAD -->
    <div id="deckTouchpad" class="deck">
      <div class="card">
        <div class="section-label">Precision Laptop Touchpad</div>
        <div id="trackpad" class="trackpad">
          Drag cursor &bull; Tap to left click &bull; 2-finger scroll
        </div>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button id="btnLeftClick" style="flex: 1; height: 50px;">Left Click</button>
          <button id="btnRightClick" style="flex: 1; height: 50px;">Right Click</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
